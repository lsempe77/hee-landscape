  </g>
  <g id="text_36">
   <text style="font-size: 9.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #52514e" x="22.68" y="42.48426" transform="rotate(-0 22.68 42.48426)">174 studies name Wellcome as a funder; 119 (68%) were published from 2020 onwards</text>
  </g>
  <g id="text_37">
   <text style="font-size: 7.2px; font-family: 'Arial', 'DejaVu Sans', sans-serif; fill: #8a8983" transform="translate(22.68 344.942648)">Eligible studies, 2010–2026, including reviews (n = 174). A study counts as Wellcome-funded when its recorded funders name the Wellcome Trust; the</text>
   <text style="font-size: 7.2px; font-family: 'Arial', 'DejaVu Sans', sans-serif; fill: #8a8983" transform="translate(22.68 353.726789)">Burroughs Wellcome Fund, a separate US foundation, is excluded. Counts describe acknowledged funding, not grant amounts. *2026 is incomplete (searches</text>
   <text style="font-size: 7.2px; font-family: 'Arial', 'DejaVu Sans', sans-serif; fill: #8a8983" transform="translate(22.68 362.51318)">ran to August 2026), so its bar is hatched. Source: docs/figures/wellcome_analysis.json (built 14 October 2026).</text>
  </g>
