project:
  type: website
  output-dir: docs
  resources:
    - .nojekyll

website:
  title: "HEE Research Landscape"
  description: "Health Economic Evaluation evidence map: 38,199 studies across 168 countries."
  site-url: "https://sempe.dev/hee-landscape/"
  repo-url: "https://github.com/lsempe77/hee-landscape"
  repo-actions: [edit, issue]
  favicon: figures/favicon.ico
  
  navbar:
    background: primary
    search: true
    left:
      - href: index.qmd
        text: "Overview"
      - href: act1-field-shape.qmd
        text: "Act I: Field Shape"
      - href: act2-topic-disease.qmd
        text: "Act II: Topic & Disease"
      - href: act3-methods-quality.qmd
        text: "Act III: Methods & Quality"
      - href: act4-geography.qmd
        text: "Act IV: Geography & Authorship"
      - href: act5-gaps.qmd
        text: "Act V: Gaps vs Burden"
      - href: act6-bibliometrics.qmd
        text: "Act VI: Bibliometrics"
      - href: funder-pack.qmd
        text: "Funder Pack"
      - href: timeline.qmd
        text: "Timelines"
      - href: atlas.qmd
        text: "Map Atlas"
      - href: paper-figures.qmd
        text: "Lancet Paper Figures"
  
  page-footer:
    left: "HEE Analysis — 38,199 eligible full economic evaluations (2010–2025)"
    right: "Built with Quarto · [View on GitHub](https://github.com/lsempe77/hee-landscape)"

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 2
    toc-location: left
    code-fold: true
    code-tools: true
    fig-cap-location: bottom
    fig-align: center
    lightbox: true
    smooth-scroll: true
    include-in-header:
      - text: |
          <script src="https://hypothes.is/embed.js" async></script>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Franklin+Gothic+Demi+Cond:wght@400;600&family=Franklin+Gothic+Book:wght@400;600&display=swap" rel="stylesheet">
    css: styles.css

execute:
  freeze: auto
  cache: true