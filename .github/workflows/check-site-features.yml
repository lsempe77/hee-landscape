# Backstop for people who have not turned on the local pre-push hook.
# Fails (and GitHub emails the pusher) when a push or pull request to main
# removes a protected design feature. See scripts/check_site_features.py.
name: Check protected site features

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_site_features.py
